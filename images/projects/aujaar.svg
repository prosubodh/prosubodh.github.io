<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0f1419"/>
  <rect x="40" y="40" width="720" height="380" rx="14" fill="#161c24"/>
  <rect x="40" y="40" width="720" height="34" rx="14" fill="#1d2530"/>
  <circle cx="62" cy="57" r="5" fill="#f87171"/>
  <circle cx="80" cy="57" r="5" fill="#fbbf24"/>
  <circle cx="98" cy="57" r="5" fill="#34d399"/>
  <rect x="130" y="47" width="280" height="20" rx="10" fill="#0f1419"/>
  <text x="270" y="61" text-anchor="middle" font-family="monospace" font-size="11" fill="#5c6875">aujaar.vercel.app/tools</text>
  <!-- input panel -->
  <rect x="70" y="100" width="300" height="290" rx="10" fill="#1a222c"/>
  <text x="90" y="128" font-family="monospace" font-size="11" fill="#8b96a3">INPUT</text>
  <text x="90" y="160" font-family="monospace" font-size="15" fill="#f472b6">^(?:[0-9]{1,3}\.){3}</text>
  <text x="90" y="185" font-family="monospace" font-size="15" fill="#f472b6">[0-9]{1,3}$</text>
  <rect x="90" y="220" width="260" height="1.5" fill="#2a333e"/>
  <text x="90" y="252" font-family="monospace" font-size="15" fill="#f472b6">0 9 * * 1-5</text>
  <text x="90" y="277" font-family="monospace" font-size="15" fill="#f472b6">SELECT * FROM orders</text>
  <!-- output panel -->
  <rect x="400" y="100" width="330" height="290" rx="10" fill="#1a222c"/>
  <text x="420" y="128" font-family="monospace" font-size="11" fill="#8b96a3">PLAIN ENGLISH</text>
  <text x="420" y="164" font-family="monospace" font-size="14" fill="#e8edf2">Matches an IPv4 address</text>
  <text x="420" y="188" font-family="monospace" font-size="14" fill="#e8edf2">like 192.168.0.1</text>
  <rect x="420" y="212" width="290" height="1.5" fill="#2a333e"/>
  <text x="420" y="246" font-family="monospace" font-size="14" fill="#e8edf2">At minute 0 of every hour,</text>
  <text x="420" y="270" font-family="monospace" font-size="14" fill="#e8edf2">Monday through Friday</text>
  <rect x="420" y="294" width="290" height="1.5" fill="#2a333e"/>
  <text x="420" y="328" font-family="monospace" font-size="14" fill="#e8edf2">Fetch every row from the</text>
  <text x="420" y="352" font-family="monospace" font-size="14" fill="#e8edf2">orders table</text>
  <rect x="420" y="352" width="0" height="0"/>
  <polygon points="362,232 376,238 362,244" fill="#8b5cf6"/>
</svg>
